[project]
name = "aibias"
version = "2.0.0rc0"  # last release, v2.0.0-preview (PEP 440 form); bumped at each release
description = "Multilingual benchmark of political and social bias in AI chat apps and their APIs."
readme = "README.md"
license = "MIT"
requires-python = ">=3.13"
dependencies = []

# Development tools, pinned with hashes in requirements-dev.txt (uv pip compile --generate-hashes); test.ps1 installs
# them in a virtual environment outside the repository.
[dependency-groups]
dev = ["ruff", "mypy"]

[tool.ruff]
target-version = "py313"
line-length = 140

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B", "UP"]

[tool.mypy]
python_version = "3.13"
files = ["aibias", "tests"]
warn_unused_ignores = true
warn_redundant_casts = true
